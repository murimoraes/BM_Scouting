[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-scouting"
version = "0.0.0"
description = "Vídeo de partida + camisa + time -> relatório individual do jogador (Onda 0: fundação)."
requires-python = ">=3.11"
# Dependências de runtime entram por onda, com aprovação humana e checagem de licença (ADR-0006).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",  # >=4.18 por causa do Registry (referencing) usado para $ref entre schemas
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
